name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (как у пользователя, без компилятора)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v
      - name: Check run.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\run.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
      - name: Smoke test server
        shell: pwsh
        run: |
          $env:SECRET_KEY = "ci"
          $p = Start-Process python -ArgumentList "-m","uvicorn","app.main:app","--port","8000" -PassThru
          for ($i=0; $i -lt 30; $i++) { try { Invoke-WebRequest http://127.0.0.1:8000/healthz -UseBasicParsing | Out-Null; break } catch { Start-Sleep 1 } }
          (Invoke-WebRequest http://127.0.0.1:8000/healthz -UseBasicParsing).Content
          Stop-Process $p.Id
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t intimate-log:ci .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 -e SECRET_KEY=ci intimate-log:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/healthz
          curl -fs http://127.0.0.1:8000/login | grep -q "Вход"
          docker logs app
